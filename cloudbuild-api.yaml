steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "dockerfiles/Dockerfile.api"
      - "-t"
      - "us-central1-docker.pkg.dev/mlops-toxic-pahse3-498520/toxic-comment-images/toxic-comment-api:cloudrun"
      - "."

images:
  - "us-central1-docker.pkg.dev/mlops-toxic-pahse3-498520/toxic-comment-images/toxic-comment-api:cloudrun"

options:
  machineType: "E2_HIGHCPU_8"

timeout: "1800s"
