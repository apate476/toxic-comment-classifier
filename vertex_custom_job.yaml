workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 100
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/mlops-toxic-pahse3-498520/toxic-comment-images/toxic-comment-training:vertex
      args:
        - data.raw_path=data/sample
        - data.train_file=train_sample.csv
      env:
        - name: MLFLOW_ALLOW_FILE_STORE
          value: "true"
