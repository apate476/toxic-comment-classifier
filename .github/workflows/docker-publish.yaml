# Continuous Docker Building workflow.
#
# - On pull_request to main:  build the image with GHA layer caching (no push).
# - On push to main:          build, push to Docker Hub (tags: latest + long SHA),
#                             then pull and run the published image as a smoke test.
#
# Required GitHub secrets:
#   DOCKER_HUB_USERNAME   - Docker Hub login
#   DOCKER_HUB_TOKEN      - Docker Hub access token (NOT the password)
#   DOCKER_HUB_REPOSITORY - Fully-qualified repo, e.g. apate476/toxic-comment-classifier

name: Docker Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only authenticate on push events; PR builds stay unauthenticated and
        # therefore cannot push, which matches the workflow contract below.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and (on push) publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile
          # Pull requests only build (no push). Pushes to main publish to Docker Hub.
          push: ${{ github.event_name == 'push' }}
          # On PRs, load the image into the local docker daemon so the smoke
          # test below can run it without needing to pull from a registry.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min caches only the final-stage layers (vs mode=max which
          # uploads every intermediate). With a ~9 GB image (driven by the
          # CUDA torch wheel), mode=max can spend 15+ minutes uploading a
          # single layer to GHA cache on a cold run.
          cache-to: type=gha,mode=min

      - name: Smoke test (pull request — local image)
        if: github.event_name == 'pull_request'
        run: |
          # When building from a fork, DOCKER_HUB_REPOSITORY may be empty;
          # in that case docker/metadata-action still emits a usable tag set,
          # but `images:` is empty. Guard with set -e so the step fails fast.
          set -euo pipefail
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          if [ -z "$IMAGE" ]; then
            echo "::error::No image tag produced by docker/metadata-action."
            exit 1
          fi
          echo "Smoke-testing local image: $IMAGE"
          # --entrypoint overrides the default training command so the smoke
          # test only validates that the package imports cleanly. A failed
          # import causes Python to exit non-zero, which fails this step.
          docker run --rm --entrypoint python "$IMAGE" \
            -c "import toxic_comment_classifier as t; print('OK', t.__file__)"

      - name: Smoke test (main — published image)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.DOCKER_HUB_REPOSITORY }}:latest"
          echo "Pulling and smoke-testing published image: $IMAGE"
          docker pull "$IMAGE"
          docker run --rm --entrypoint python "$IMAGE" \
            -c "import toxic_comment_classifier as t; print('OK', t.__file__)"
